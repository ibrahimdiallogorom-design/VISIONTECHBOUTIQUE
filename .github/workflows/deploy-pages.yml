name: Déploiement Automatique SahelExpress sur GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetage du dossier public/ (Application PWA & Mobile)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Publication sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
