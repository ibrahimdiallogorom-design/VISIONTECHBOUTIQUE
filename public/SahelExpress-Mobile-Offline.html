<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#d97706" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SahelExpress Mobile (Autonome Hors-Ligne)</title>
  <style>/* ==========================================================================
   SahelExpress — Feuille de Style Autonome (Chapitre 6.1 : Zéro Google Fonts)
   Optimisée pour lisibilité en plein soleil et écrans Android d'entrée de gamme
   ========================================================================== */

:root {
  --bg-main: #0f172a;
  --bg-card: #1e293b;
  --bg-elevated: #334155;
  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  --accent-amber: #f59e0b;
  --accent-amber-dark: #d97706;
  --online-green: #10b981;
  --online-bg: rgba(16, 185, 129, 0.16);
  --offline-orange: #f97316;
  --offline-bg: rgba(249, 115, 22, 0.18);
  --danger-red: #ef4444;
  --border-color: #334155;
  --radius-md: 12px;
  --radius-lg: 16px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
  background-color: var(--bg-main);
  color: var(--text-primary);
  line-height: 1.45;
  padding-bottom: 90px;
}

/* Bandeau d'état réseau en haut (Exigence 5.1) */
.status-banner {
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  font-size: 0.88rem;
  font-weight: 700;
  border-bottom: 2px solid transparent;
  transition: all 0.2s ease;
}

.status-banner.online {
  background-color: #064e3b;
  color: #a7f3d0;
  border-bottom-color: var(--online-green);
}

.status-banner.offline {
  background-color: #7c2d12;
  color: #fed7aa;
  border-bottom-color: var(--offline-orange);
}

.status-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.online .status-dot {
  background-color: #34d399;
  box-shadow: 0 0 8px #34d399;
}

.offline .status-dot {
  background-color: #fb923c;
  box-shadow: 0 0 8px #fb923c;
}

.banner-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-sim-offline {
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.76rem;
  font-weight: 600;
  cursor: pointer;
}

.btn-sim-offline:hover {
  background: rgba(255, 255, 255, 0.24);
}

/* En-tête principal */
.app-header {
  max-width: 1120px;
  margin: 0 auto;
  padding: 16px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border-color);
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent-amber), #ea580c);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  font-weight: 900;
  color: #0f172a;
}

.brand-text h1 {
  font-size: 1.35rem;
  letter-spacing: -0.02em;
  color: #fff;
}

.brand-text p {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.nav-tabs {
  display: flex;
  gap: 8px;
}

.tab-btn {
  background: var(--bg-card);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  padding: 9px 14px;
  border-radius: var(--radius-md);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tab-btn.active {
  background: var(--accent-amber);
  color: #0f172a;
  border-color: var(--accent-amber);
  font-weight: 700;
}

.cart-badge {
  background: #0f172a;
  color: var(--accent-amber);
  padding: 1px 7px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 800;
}

.tab-btn.active .cart-badge {
  background: #0f172a;
  color: #fff;
}

/* Conteneur principal */
.main-container {
  max-width: 1120px;
  margin: 0 auto;
  padding: 16px;
}

/* Barre de recherche & Filtres Catégories */
.controls-bar {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 18px;
}

.search-box {
  position: relative;
  width: 100%;
}

.search-input {
  width: 100%;
  padding: 13px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 0.98rem;
}

.search-input:focus {
  outline: 2px solid var(--accent-amber);
  border-color: transparent;
}

.category-pills {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.cat-pill {
  white-space: nowrap;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 0.84rem;
  font-weight: 600;
  cursor: pointer;
}

.cat-pill.active {
  background: rgba(245, 158, 11, 0.2);
  color: var(--accent-amber);
  border-color: var(--accent-amber);
}

/* Grille Catalogue Produits */
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 16px;
}

.product-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  transition: transform 0.15s ease, border-color 0.15s ease;
}

.product-card:hover {
  border-color: var(--accent-amber);
}

.product-thumb {
  height: 120px;
  border-radius: 10px;
  background: linear-gradient(135deg, #1e293b, #0f172a);
  border: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
  position: relative;
}

.thumb-icon {
  font-size: 2.6rem;
}

.thumb-meta {
  text-align: right;
}

.product-code {
  display: inline-block;
  background: var(--bg-elevated);
  color: var(--accent-amber);
  font-family: monospace;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
}

.product-cat-tag {
  display: block;
  font-size: 0.73rem;
  color: var(--text-muted);
  margin-top: 4px;
}

.product-title {
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--text-primary);
  cursor: pointer;
}

.product-price-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-top: 4px;
}

.price-fcfa {
  font-size: 1.18rem;
  font-weight: 800;
  color: var(--accent-amber);
}

.stock-badge {
  font-size: 0.75rem;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--online-bg);
  color: #34d399;
  font-weight: 600;
}

.stock-badge.low {
  background: var(--offline-bg);
  color: #fb923c;
}

.card-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-primary {
  width: 100%;
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: var(--accent-amber);
  color: #0f172a;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
}

.btn-primary:hover {
  background: var(--accent-amber-dark);
  color: #fff;
}

.qty-stepper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  background: var(--bg-main);
  border: 1px solid var(--accent-amber);
  border-radius: 10px;
  padding: 4px;
}

.qty-btn {
  width: 34px;
  height: 32px;
  border-radius: 8px;
  border: none;
  background: var(--bg-elevated);
  color: #fff;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
}

.qty-val {
  font-weight: 800;
  font-size: 0.95rem;
  color: var(--accent-amber);
}

/* Vue Panier & Choix de Livraison (Chapitre 5.1) */
.checkout-grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 20px;
}

@media (max-width: 820px) {
  .checkout-grid {
    grid-template-columns: 1fr;
  }
}

.panel-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 18px;
}

.panel-card h2 {
  font-size: 1.12rem;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 10px;
}

.cart-item-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  gap: 10px;
}

.cart-item-info h4 {
  font-size: 0.92rem;
  color: var(--text-primary);
}

.cart-item-info small {
  color: var(--text-muted);
  font-family: monospace;
}

.cart-summary-total {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 2px dashed var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 1.2rem;
  font-weight: 800;
}

.cart-summary-total span:last-child {
  color: var(--accent-amber);
}

/* Formulaire de Livraison */
.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 5px;
}

.form-control {
  width: 100%;
  padding: 11px 12px;
  border-radius: 10px;
  border: 1px solid var(--border-color);
  background: var(--bg-main);
  color: var(--text-primary);
  font-size: 0.94rem;
}

.sms-preview-box {
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
  background: #090d16;
  border: 1px solid var(--offline-orange);
}

.sms-preview-box small {
  display: block;
  color: #fb923c;
  font-weight: 700;
  font-size: 0.76rem;
  margin-bottom: 4px;
}

.sms-code-line {
  font-family: monospace;
  font-size: 0.85rem;
  color: #fde68a;
  word-break: break-all;
}

/* Modal Fiche Produit & Résultat Envoi */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(2, 6, 23, 0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 2000;
}

.modal-box {
  background: var(--bg-card);
  border: 1px solid var(--accent-amber);
  border-radius: var(--radius-lg);
  max-width: 520px;
  width: 100%;
  padding: 20px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.btn-close {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 1.4rem;
  cursor: pointer;
}

/* Barre flottante Panier en bas */
.bottom-cart-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #111827;
  border-top: 2px solid var(--accent-amber);
  padding: 12px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 990;
}

.bottom-cart-info {
  font-size: 0.92rem;
}

.bottom-cart-info strong {
  color: var(--accent-amber);
  font-size: 1.08rem;
}


/* ==========================================================================
   Module Gestion & Dispatch (Tableau de Bord Commerçant / Livreur - Étape 3)
   + Impression Thermique 58mm / 80mm
   ========================================================================== */

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 14px 16px;
}

.kpi-card small {
  color: var(--text-muted);
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
}

.kpi-card .kpi-value {
  font-size: 1.5rem;
  font-weight: 900;
  margin-top: 4px;
  color: var(--text-primary);
}

.orders-queue-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.order-dispatch-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-left: 5px solid var(--accent-amber);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.order-dispatch-card.channel-SMS {
  border-left-color: #f97316;
}

.order-dispatch-card.channel-DATA_HTTPS {
  border-left-color: #10b981;
}

.order-dispatch-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  padding-bottom: 10px;
}

.badge-channel {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.76rem;
  font-weight: 800;
}

.badge-channel.SMS {
  background: rgba(249, 115, 22, 0.2);
  color: #fb923c;
  border: 1px solid #f97316;
}

.badge-channel.DATA_HTTPS,
.badge-channel.LOCAL_WIFI {
  background: rgba(16, 185, 129, 0.2);
  color: #34d399;
  border: 1px solid #10b981;
}

.badge-statut {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.76rem;
  font-weight: 800;
}

.badge-statut.RECUE {
  background: rgba(245, 158, 11, 0.2);
  color: #fbbf24;
}

.badge-statut.EN_COURS {
  background: rgba(59, 130, 246, 0.22);
  color: #60a5fa;
}

.badge-statut.LIVREE {
  background: rgba(16, 185, 129, 0.22);
  color: #34d399;
}

.badge-statut.ANNULEE {
  background: rgba(239, 68, 68, 0.22);
  color: #f87171;
}

.dispatch-actions-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  padding-top: 8px;
  border-top: 1px dashed var(--border-color);
}

.btn-call-client {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 8px;
  background: #059669;
  color: #fff;
  text-decoration: none;
  font-weight: 800;
  font-size: 0.85rem;
}

.btn-call-client:hover {
  background: #047857;
}

.btn-print-slip {
  padding: 8px 14px;
  border-radius: 8px;
  background: var(--bg-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
}

.btn-print-slip:hover {
  border-color: var(--accent-amber);
  color: var(--accent-amber);
}

/* Bon de Livraison / Préparation Thermique 58mm & 80mm */
.thermal-slip-wrapper {
  background: #ffffff;
  color: #000000;
  font-family: "Courier New", Courier, monospace;
  margin: 0 auto;
  padding: 14px;
  border-radius: 4px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

.thermal-slip-wrapper.width-58mm {
  width: 240px;
  font-size: 11px;
}

.thermal-slip-wrapper.width-80mm {
  width: 310px;
  font-size: 12px;
}

.thermal-center {
  text-align: center;
}

.thermal-divider {
  border-top: 1px dashed #000;
  margin: 8px 0;
}

.thermal-table {
  width: 100%;
  border-collapse: collapse;
}

.thermal-table th,
.thermal-table td {
  text-align: left;
  padding: 3px 0;
  vertical-align: top;
}

.thermal-table .right {
  text-align: right;
}

/* Règle d'impression dédiée aux imprimantes thermiques 58mm/80mm */
@media print {
  body * {
    visibility: hidden;
  }
  #thermal-print-area,
  #thermal-print-area * {
    visibility: visible;
  }
  #thermal-print-area {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    background: #fff;
    color: #000;
    box-shadow: none;
  }
  .no-print {
    display: none !important;
  }
}
</style>
</head>

class LocalStore {
  constructor() {
    this.db = null;
  }

  async open() {
    if (this.db) return this.db;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('articles')) {
          const store = db.createObjectStore('articles', { keyPath: 'id' });
          store.createIndex('categorie', 'categorie', { unique: false });
        }
        if (!db.objectStoreNames.contains('cart')) {
          db.createObjectStore('cart', { keyPath: 'article_id' });
        }
        if (!db.objectStoreNames.contains('orders_history')) {
          db.createObjectStore('orders_history', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('reviews_local')) {
          db.createObjectStore('reviews_local', { keyPath: 'id', autoIncrement: true });
        }
        if (!db.objectStoreNames.contains('meta')) {
          db.createObjectStore('meta', { keyPath: 'key' });
        }
      };
      req.onsuccess = (e) => {
        this.db = e.target.result;
        resolve(this.db);
      };
      req.onerror = (e) => reject(e.target.error);
    });
  }

  async getMeta(key, defaultValue = null) {
    const db = await this.open();
    return new Promise((resolve) => {
      const tx = db.transaction('meta', 'readonly');
      const req = tx.objectStore('meta').get(key);
      req.onsuccess = () => resolve(req.result ? req.result.value : defaultValue);
      req.onerror = () => resolve(defaultValue);
    });
  }

  async setMeta(key, value) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('meta', 'readwrite');
      tx.objectStore('meta').put({ key, value });
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e.target.error);
    });
  }

  async getAllArticles() {
    const db = await this.open();
    return new Promise((resolve) => {
      const tx = db.transaction('articles', 'readonly');
      const req = tx.objectStore('articles').getAll();
      req.onsuccess = async () => {
        const list = req.result || [];
        if (list.length === 0) {
          await this.applyDeltaSync(FALLBACK_EMBEDDED_CATALOG, []);
          resolve(FALLBACK_EMBEDDED_CATALOG);
        } else {
          // Garantir que commercant_id et nom_boutique existent sur les anciens enregistrements
          const enriched = list
            .filter((a) => Boolean(a.is_active))
            .map((a) => {
              const fb = FALLBACK_EMBEDDED_CATALOG.find((f) => f.id === a.id);
              return {
                commercant_id: a.commercant_id || (fb ? fb.commercant_id : 'M-SAHEL'),
                nom_boutique: a.nom_boutique || (fb ? fb.nom_boutique : 'SahelExpress Centrale'),
                ...a
              };
            });
          resolve(enriched);
        }
      };
      req.onerror = () => resolve(FALLBACK_EMBEDDED_CATALOG);
    });
  }

  async applyDeltaSync(updatedArticles = [], deletedIds = []) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('articles', 'readwrite');
      const store = tx.objectStore('articles');

      for (const art of updatedArticles) {
        store.put(art);
      }
      for (const id of deletedIds) {
        store.delete(id);
      }

      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e.target.error);
    });
  }

  async getCart() {
    const db = await this.open();
    return new Promise((resolve) => {
      const tx = db.transaction('cart', 'readonly');
      const req = tx.objectStore('cart').getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    });
  }

  async setCartItem(article, quantite) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('cart', 'readwrite');
      const store = tx.objectStore('cart');
      if (quantite <= 0) {
        store.delete(article.id);
      } else {
        store.put({
          article_id: article.id,
          commercant_id: article.commercant_id || 'M-SAHEL',
          nom_boutique: article.nom_boutique || 'SahelExpress Centrale',
          designation: article.designation,
          categorie: article.categorie,
          prix_unitaire: article.prix_unitaire,
          quantite
        });
      }
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e.target.error);
    });
  }

  async clearCart() {
    const db = await this.open();
    return new Promise((resolve) => {
      const tx = db.transaction('cart', 'readwrite');
      tx.objectStore('cart').clear();
      tx.oncomplete = () => resolve();
    });
  }

  async saveLocalOrder(orderRecord) {
    const db = await this.open();
    return new Promise((resolve) => {
      const tx = db.transaction('orders_history', 'readwrite');
      tx.objectStore('orders_history').put(orderRecord);
      tx.oncomplete = () => resolve();
    });
  }

  async getLocalOrders() {
    const db = await this.open();
    return new Promise((resolve) => {
      const tx = db.transaction('orders_history', 'readonly');
      const req = tx.objectStore('orders_history').getAll();
      req.onsuccess = () => {
        const list = req.result || [];
        list.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
        resolve(list);
      };
      req.onerror = () => resolve([]);
    });
  }

  async saveLocalReview(review) {
    const db = await this.open();
    return new Promise((resolve) => {
      const tx = db.transaction('reviews_local', 'readwrite');
      tx.objectStore('reviews_local').put(review);
      tx.oncomplete = () => resolve();
    });
  }

  async getLocalReviews() {
    const db = await this.open();
    return new Promise((resolve) => {
      const tx = db.transaction('reviews_local', 'readonly');
      const req = tx.objectStore('reviews_local').getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    });
  }
}

window.SahelLocalStore = new LocalStore();

/**
 * Enregistre le profil Acheteur (Nom + Numéro WhatsApp) à l'ouverture
 * dans le stockage local ET dans la base de données du serveur pour les avis et offres produits
 */
async function completeBuyerOnboarding(e) {
  e.preventDefault();
  const nom = (document.getElementById('onboard-nom').value || '').trim();
  const whatsapp = (document.getElementById('onboard-whatsapp').value || '').trim();
  const ville = document.getElementById('onboard-ville').value || 'Gorom-Gorom';
  const repere = (document.getElementById('onboard-repere').value || '').trim() || 'DOMICILE';

  if (!nom || whatsapp.length < 8) {
    alert('Veuillez entrer votre nom complet et votre numéro de téléphone WhatsApp.');
    return;
  }

  state.buyerForm.nomComplet = nom;
  state.buyerForm.whatsapp = whatsapp;
  state.buyerForm.telephone = whatsapp;
  state.buyerForm.ville = ville;
  state.buyerForm.pointRepere = repere;

  const secteurs = SAHEL_LOCALITES[ville] || SAHEL_LOCALITES['Gorom-Gorom'];
  state.buyerForm.quartierCode = secteurs[0].code;

  saveBuyerFormToStorage();
  localStorage.setItem('sahel_buyer_onboarded', 'true');
  state.buyerOnboarded = true;
  state.showProfileModal = false;

  // Synchroniser le profil acheteur avec le backend s'il est joignable
  if (isEffectiveOnline()) {
    try {
      const res = await fetch('/api/buyers/onboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          client_id: state.buyerForm.clientCode,
          nom_complet: nom,
          whatsapp,
          telephone: whatsapp,
          ville,
          secteur_quartier: state.buyerForm.quartierCode,
          point_repere: repere
        })
      });
      if (res.ok) {
        const data = await res.json();
        if (data.client && data.client.id) {
          state.buyerForm.clientCode = data.client.id;
          saveBuyerFormToStorage();
        }
        if (data.token) {
          localStorage.setItem('sahel_buyer_jwt', data.token);
        }
      }
    } catch {
      // Hors-ligne ou sur GitHub Pages : profil sauvegardé localement, sera transmis à la prochaine commande
    }
  }

  renderApp();
}

function generateCompactSmsPayload() {
  const shortPay =
    state.buyerForm.modePaiement === 'ORANGE_MONEY'
      ? 'OM'
      : state.buyerForm.modePaiement === 'MOOV_MONEY'
      ? 'MOOV'
      : 'ESP';

  const cleanClient = (state.buyerForm.clientCode || 'CL890')
    .trim()
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, '');

  const cleanQuartier = (state.buyerForm.quartierCode || 'SEC3')
    .trim()
    .toUpperCase()
    .replace(/[^A-Z0-9_-]/g, '');

  const cleanNote = (state.buyerForm.pointRepere || 'DOMICILE')
    .trim()
    .toUpperCase()
    .replace(/\s+/g, '_')
    .replace(/#/g, '')
    .slice(0, 45);

  const itemsPart =
    state.cart.length > 0
      ? state.cart.map((c) => `${c.article_id}:${c.quantite}`).join(';')
      : 'PROD01:1';

  return `CMD#${cleanClient}#${cleanQuartier}#${itemsPart}#${shortPay}#${cleanNote}`;
}

async function syncCatalogDelta() {
  const store = window.SahelLocalStore;
  const savedHash = await store.getMeta('catalog_hash', '');
  const savedSince = await store.getMeta('last_sync_timestamp', '');

  state.catalogHash = savedHash;
  state.lastSyncTime = savedSince;

  if (!isEffectiveOnline()) {
    state.articles = await store.getAllArticles();
    state.reviews = await store.getLocalReviews();
    renderApp();
    return;
  }

  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 4000);

    const [syncRes, merchRes, revRes] = await Promise.all([
      fetch(`/api/catalog/sync?since=${encodeURIComponent(savedSince)}&hash=${encodeURIComponent(savedHash)}`, { signal: controller.signal }),
      fetch('/api/merchants/public', { signal: controller.signal }).catch(() => null),
      fetch('/api/reviews', { signal: controller.signal }).catch(() => null)
    ]);

    clearTimeout(timer);

    if (syncRes && syncRes.ok) {
      const data = await syncRes.json();
      if (data.logistics_sms_number) {
        state.logisticsSmsNumber = data.logistics_sms_number;
      }
      if (!data.up_to_date && Array.isArray(data.updated_articles)) {
        await store.applyDeltaSync(data.updated_articles, data.deleted_article_ids || []);
        await store.setMeta('catalog_hash', data.catalog_hash || '');
        await store.setMeta('last_sync_timestamp', data.sync_timestamp || new Date().toISOString());
      }
    }

    if (merchRes && merchRes.ok) {
      const mData = await merchRes.json();
      if (Array.isArray(mData.merchants) && mData.merchants.length > 0) {
        state.merchantsList = mData.merchants;
      }
    }

    if (revRes && revRes.ok) {
      const rData = await revRes.json();
      if (Array.isArray(rData.reviews)) {
        state.reviews = rData.reviews;
      }
    }
  } catch {
    // Fallback local silencieux
  }

  state.articles = await store.getAllArticles();
  if (state.reviews.length === 0) {
    state.reviews = await store.getLocalReviews();
  }
  renderApp();
}

async function updateCartQuantity(articleId, delta) {
  const article = state.articles.find((a) => a.id === articleId);
  if (!article) return;

  const existing = state.cart.find((c) => c.article_id === articleId);
  const currentQty = existing ? existing.quantite : 0;
  const nextQty = Math.max(0, currentQty + delta);

  await window.SahelLocalStore.setCartItem(article, nextQty);
  state.cart = await window.SahelLocalStore.getCart();
  renderApp();
}

async function submitBuyerReview(e) {
  e.preventDefault();
  const commercantId = document.getElementById('rev-merchant').value || 'M-SAHEL';
  const articleId = document.getElementById('rev-article').value || '';
  const note = parseInt(document.getElementById('rev-note').value || '5', 10);
  const commentaire = (document.getElementById('rev-comment').value || '').trim();
  const suggestion = (document.getElementById('rev-suggestion').value || '').trim();

  if (!commentaire && !suggestion) {
    alert('Veuillez écrire votre avis ou le produit que vous aimeriez qu\'on vous propose.');
    return;
  }

  const payload = {
    commercant_id: commercantId,
    article_id: articleId,
    client_id: state.buyerForm.clientCode,
    client_nom: state.buyerForm.nomComplet || 'Client SahelExpress',
    client_whatsapp: state.buyerForm.whatsapp || state.buyerForm.telephone,
    note,
    commentaire,
    suggestion_produit: suggestion,
    created_at: new Date().toISOString()
  };

  await window.SahelLocalStore.saveLocalReview(payload);

  if (isEffectiveOnline()) {
    try {
      await fetch('/api/reviews', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } catch {
      // Sauvegardé en local
    }
  }

  state.reviews.unshift(payload);
  renderApp();
  alert('Merci ! Votre avis et votre suggestion ont été enregistrés avec votre numéro WhatsApp.');
}

async function submitAdaptiveOrder() {
  if (state.cart.length === 0) return;
  saveBuyerFormToStorage();

  const totalFcfa = state.cart.reduce((sum, i) => sum + i.prix_unitaire * i.quantite, 0);
  const smsPayload = generateCompactSmsPayload();
  const smsHref = `sms:${state.logisticsSmsNumber}?body=${encodeURIComponent(smsPayload)}`;

  const btnSubmit = document.getElementById('btn-validate-order');
  if (btnSubmit) {
    btnSubmit.disabled = true;
    btnSubmit.textContent = '⏳ Tentative d\'envoi Data HTTPS (Timeout 5s)...';
  }

  if (isEffectiveOnline()) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      const response = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: controller.signal,
        body: JSON.stringify({
          client: {
            id: state.buyerForm.clientCode,
            telephone: state.buyerForm.whatsapp || state.buyerForm.telephone,
            whatsapp: state.buyerForm.whatsapp || state.buyerForm.telephone,
            nom_complet: state.buyerForm.nomComplet,
            ville: state.buyerForm.ville,
            secteur_quartier: state.buyerForm.quartierCode,
            point_repere: state.buyerForm.pointRepere
          },
          mode_transmission: 'DATA_HTTPS',
          mode_paiement: state.buyerForm.modePaiement,
          items: state.cart.map((c) => ({
            article_id: c.article_id,
            quantite: c.quantite
          }))
        })
      });

      clearTimeout(timeoutId);

      if (response.ok) {
        const result = await response.json();
        await window.SahelLocalStore.saveLocalOrder({
          id: result.order.id,
          total_fcfa: totalFcfa,
          mode_transmission: 'DATA_HTTPS',
          statut: result.order.statut,
          adresse_livraison: result.order.adresse_livraison,
          items_count: state.cart.reduce((s, i) => s + i.quantite, 0),
          created_at: result.order.created_at
        });

        await window.SahelLocalStore.clearCart();
        state.cart = [];
        state.localOrders = await window.SahelLocalStore.getLocalOrders();
        state.lastOrderResultModal = {
          mode: 'DATA_HTTPS',
          orderId: result.order.id,
          totalFcfa,
          adresse: result.order.adresse_livraison
        };
        await syncCatalogDelta();
        return;
      }
    } catch {
      console.warn('[SahelExpress] Timeout 5s ou Hors-Ligne -> Bascule SMS.');
    }
  }

  const localSmsOrderId = 'SMS-LOCAL-' + Date.now().toString(36).toUpperCase().slice(-4);
  await window.SahelLocalStore.saveLocalOrder({
    id: localSmsOrderId,
    total_fcfa: totalFcfa,
    mode_transmission: 'SMS',
    statut: 'EN_ATTENTE_SMS',
    adresse_livraison: `${state.buyerForm.ville} - ${state.buyerForm.quartierCode} (${state.buyerForm.pointRepere})`,
    raw_sms_payload: smsPayload,
    items_count: state.cart.reduce((s, i) => s + i.quantite, 0),
    created_at: new Date().toISOString()
  });

  await window.SahelLocalStore.clearCart();
  state.cart = [];
  state.localOrders = await window.SahelLocalStore.getLocalOrders();

  state.lastOrderResultModal = {
    mode: 'SMS_FALLBACK',
    orderId: localSmsOrderId,
    totalFcfa,
    smsPayload,
    smsHref,
    logisticsNumber: state.logisticsSmsNumber
  };

  renderApp();

  try {
    window.location.href = smsHref;
  } catch {}
}

async function simulateGatewaySmsDelivery(smsPayload) {
  try {
    const res = await fetch('/api/sms/incoming', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from: state.buyerForm.whatsapp || state.buyerForm.telephone,
        message: smsPayload
      })
    });
    const data = await res.json();
    if (res.ok && data.order) {
      state.lastOrderResultModal.gatewayAck = data.sms_reply;
      state.lastOrderResultModal.confirmedServerId = data.order.id;
      renderApp();
    }
  } catch {
    alert('Serveur injoignable pour la simulation de passerelle.');
  }
}

            </div>
            <p style="font-size:0.9rem; margin-bottom:10px;">
              L'absence de connexion Internet (ou le dépassement du délai de 5s) a déclenché le <strong>Protocole SMS Compacté</strong> vers le numéro central <strong>${res.logisticsNumber}</strong> :
            </p>
            <div class="sms-preview-box" style="margin-bottom:12px;">
              <small>CHAÎNE SMS GÉNÉRÉE :</small>
              <div class="sms-code-line">${res.smsPayload}</div>
            </div>
            ${
              res.gatewayAck
                ? `<div style="padding:10px; background:var(--online-bg); border:1px solid #34d399; border-radius:8px; margin-bottom:12px; font-size:0.84rem; color:#a7f3d0;">
                     <strong>✅ Accusé de réception de la Passerelle SMS :</strong><br/>
                     ${res.gatewayAck}
                   </div>`
                : ''
            }
            <div style="display:flex; flex-direction:column; gap:8px;">
              <a href="${res.smsHref}" class="btn-primary" style="text-align:center; text-decoration:none; display:block;">
                📲 Ouvrir l'application SMS Android (${res.logisticsNumber})
              </a>
              <button type="button" class="btn-sim-offline" id="btn-sim-gateway" style="padding:10px; font-size:0.85rem; background:#1e293b; border-color:var(--accent-amber); color:var(--accent-amber);">
                🧪 Simuler la réception immédiate par la Passerelle SMS du Serveur
              </button>
              <button type="button" class="btn-sim-offline" id="btn-ok-res-modal" style="padding:8px;">
                Fermer
              </button>
            </div>
          </div>
        </div>
      `;
    }

    const closeFn = () => {
      state.lastOrderResultModal = null;
      renderModals();
    };
    document.getElementById('btn-close-res-modal').onclick = closeFn;
    document.getElementById('btn-ok-res-modal').onclick = closeFn;
    const simBtn = document.getElementById('btn-sim-gateway');
    if (simBtn) {
      simBtn.onclick = () => simulateGatewaySmsDelivery(res.smsPayload);
    }
    return;
  }

  modalContainer.innerHTML = '';
}

function renderApp() {
  renderStatusBanner();

  const totalCartItems = state.cart.reduce((sum, i) => sum + i.quantite, 0);
  const totalCartFcfa = state.cart.reduce((sum, i) => sum + i.prix_unitaire * i.quantite, 0);

  const badgeEl = document.getElementById('nav-cart-badge');
  if (badgeEl) badgeEl.textContent = totalCartItems;

  document.querySelectorAll('.tab-btn[data-tab]').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.tab === state.activeTab);
  });

  const viewRoot = document.getElementById('app-view-root');
  if (!viewRoot) return;

  if (state.activeTab === 'catalog') {
    viewRoot.innerHTML = renderCatalogView();
  } else if (state.activeTab === 'cart') {
    viewRoot.innerHTML = renderCartView();
  } else if (state.activeTab === 'reviews') {
    viewRoot.innerHTML = renderReviewsView();
  } else {
    viewRoot.innerHTML = renderHistoryView();
  }

  const bottomBar = document.getElementById('bottom-cart-bar');
  if (bottomBar) {
    if (state.activeTab === 'catalog' && totalCartItems > 0) {
      bottomBar.style.display = 'flex';
      bottomBar.innerHTML = `
        <div class="bottom-cart-info">
          <span>🛒 <strong>${totalCartItems} article(s)</strong> dans votre panier</span><br/>
          <span>Total : <strong>${formatFcfa(totalCartFcfa)}</strong></span>
        </div>
        <button type="button" class="btn-primary" style="width:auto; padding:10px 18px;" id="btn-goto-cart">
          Commander →
        </button>
      `;
      document.getElementById('btn-goto-cart').onclick = () => {
        state.activeTab = 'cart';
        renderApp();
      };
    } else {
      bottomBar.style.display = 'none';
    }
  }

  bindViewEvents();
  renderModals();
}

function bindViewEvents() {
  const searchInput = document.getElementById('catalog-search-input');
  if (searchInput) {
    searchInput.oninput = (e) => {
      state.searchQuery = e.target.value;
      const cursorPos = e.target.selectionStart;
      renderApp();
      const restored = document.getElementById('catalog-search-input');
      if (restored) {
        restored.focus();
        restored.setSelectionRange(cursorPos, cursorPos);
      }
    };
  }

  document.querySelectorAll('[data-merch]').forEach((btn) => {
    btn.onclick = () => {
      state.selectedMerchantId = btn.dataset.merch;
      renderApp();
    };
  });

  document.querySelectorAll('[data-cat]').forEach((btn) => {
    btn.onclick = () => {
      state.selectedCategory = btn.dataset.cat;
      renderApp();
    };
  });

  document.querySelectorAll('[data-add-id]').forEach((btn) => {
    btn.onclick = () => updateCartQuantity(btn.dataset.addId, 1);
  });

  document.querySelectorAll('[data-inc-id]').forEach((btn) => {
    btn.onclick = () => updateCartQuantity(btn.dataset.incId, 1);
  });

  document.querySelectorAll('[data-dec-id]').forEach((btn) => {
    btn.onclick = () => updateCartQuantity(btn.dataset.decId, -1);
  });

  document.querySelectorAll('[data-open-product]').forEach((el) => {
    el.onclick = () => {
      const art = state.articles.find((a) => a.id === el.dataset.openProduct);
      if (art) {
        state.selectedProductModal = art;
        renderModals();
      }
    };
  });

  const bindInput = (id, key, refreshView = false) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.oninput = (e) => {
      state.buyerForm[key] = e.target.value;
      saveBuyerFormToStorage();
      if (refreshView) {
        renderApp();
      } else {
        const previewEl = document.getElementById('live-sms-preview');
        if (previewEl) previewEl.textContent = generateCompactSmsPayload();
      }
    };
  };

  bindInput('inp-whatsapp', 'whatsapp');
  bindInput('inp-nom', 'nomComplet');
  bindInput('sel-ville', 'ville', true);
  bindInput('sel-quartier', 'quartierCode');
  bindInput('inp-repere', 'pointRepere');
  bindInput('sel-paiement', 'modePaiement');

  const btnValidate = document.getElementById('btn-validate-order');
  if (btnValidate) {
    btnValidate.onclick = submitAdaptiveOrder;
  }

  const formReview = document.getElementById('form-buyer-review');
  if (formReview) {
    formReview.onsubmit = submitBuyerReview;
  }
}

async function initApp() {
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('./sw.js');
    } catch {}
  }

  window.addEventListener('online', () => {
    state.isOnline = true;
    syncCatalogDelta();
  });
  window.addEventListener('offline', () => {
    state.isOnline = false;
    renderApp();
  });

  document.querySelectorAll('.tab-btn[data-tab]').forEach((btn) => {
    btn.onclick = () => {
      state.activeTab = btn.dataset.tab;
      renderApp();
    };
  });

  const btnEditProfile = document.getElementById('btn-edit-buyer-profile');
  if (btnEditProfile) {
    btnEditProfile.onclick = () => {
      state.showProfileModal = true;
      renderModals();
    };
  }

  state.articles = await window.SahelLocalStore.getAllArticles();
  state.cart = await window.SahelLocalStore.getCart();
  state.localOrders = await window.SahelLocalStore.getLocalOrders();
  renderApp();

  await syncCatalogDelta();
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
